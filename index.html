<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock paper Scissors</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="cslog-container">
        <div class="score">
            <p id="humanScore">Human: 0</p>
            <p id="computerScore">Computer: 0</p>
            <p id="roundTable">Round: 1</p>
        </div>
        <div class="cslog-screen" id="result"></div>
    </div>

    <div class="btn-container">
        <button id="rock" class="rock-btn">Rock</button>
        <button id="scissors" class="scissors-btn">Scissors</button>
        <button id="paper" class="paper-btn">Paper</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
